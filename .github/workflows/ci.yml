name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-e2e:
    name: Calidad, build y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Verificar Astro y TypeScript
        run: npm run check

      - name: Ejecutar lint
        run: npm run lint

      - name: Verificar formato
        run: npm run format:check

      - name: Generar sitio estático
        run: npm run build

      - name: Verificar presupuesto y salida estática
        run: npm run verify:build

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Ejecutar pruebas E2E
        run: npm run test:e2e

      - name: Adjuntar diagnósticos de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
